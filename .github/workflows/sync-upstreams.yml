name: sync upstream default branches

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name, or all
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-default-branch-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inventory
        run: python3 scripts/validate_inventory.py
      - name: Find forks that need attention
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          SELECTED_REPOSITORY: ${{ inputs.repository || 'all' }}
        run: >-
          python3 scripts/matrix.py
          --repository "$SELECTED_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  sync:
    if: needs.prepare.outputs.count != '0'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan result
        run: echo 'Queued because ${{ matrix.scan_state }}'
      - name: Mint repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RUBY_ZIG_SYNC_APP_ID }}
          private-key: ${{ secrets.RUBY_ZIG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.destination_owner }}
          repositories: ${{ matrix.name }}
          permission-contents: write
          permission-workflows: write
      - name: Fast-forward default branch
        id: sync
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPORT: ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.name }}.json
        run: |
          chmod +x scripts/sync-one.sh
          scripts/sync-one.sh \
            --name '${{ matrix.name }}' \
            --upstream '${{ matrix.upstream }}' \
            --branch '${{ matrix.branch }}' \
            --destination-owner '${{ matrix.destination_owner }}' \
            --report "$REPORT"
      - name: Publish lane summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.name }}.json
        run: |
          if [[ -s "$REPORT" ]]; then
            jq -r '"### `" + .repository + "`\n\nStatus: **" + .status + "**\n\nBefore: `" + (.before // "") + "`\n\nUpstream: `" + (.upstream_sha // "") + "`"' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sync report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-${{ matrix.name }}
          path: ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.name }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Propagate sync failure
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: test "$SYNC_OUTCOME" = success
