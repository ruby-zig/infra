name: sync tracked upstream branches

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Repository name, or all
        required: true
        default: all
        type: string
      branch:
        description: Optional tracked branch for one exact repository
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-tracked-branch-sync
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inventories
        run: |
          python3 scripts/validate_inventory.py config/repositories.json \
            --expected-count 39 \
            --require-scope native-build-affected
          python3 scripts/validate_inventory.py config/discovery-repositories.json \
            --expected-count 190
      - name: Find refs that need attention
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          SELECTED_REPOSITORY: ${{ inputs.repository || 'all' }}
          SELECTED_BRANCH: ${{ inputs.branch || '' }}
        run: >-
          python3 scripts/matrix.py
          --repository "$SELECTED_REPOSITORY"
          --branch "$SELECTED_BRANCH"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  sync:
    if: needs.prepare.outputs.count != '0'
    needs: prepare
    name: sync ${{ matrix.name }}@${{ matrix.branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan result
        env:
          SCAN_STATE: ${{ matrix.scan_state }}
        run: echo "Queued because $SCAN_STATE"
      - name: Mint repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RUBY_ZIG_SYNC_APP_ID }}
          private-key: ${{ secrets.RUBY_ZIG_SYNC_APP_PRIVATE_KEY }}
          owner: ${{ matrix.destination_owner }}
          repositories: ${{ matrix.name }}
          permission-contents: write
          permission-workflows: write
      - name: Fast-forward tracked branch
        id: sync
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPORT: ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.lane_id }}.json
        run: |
          chmod +x scripts/sync-one.sh
          scripts/sync-one.sh \
            --name '${{ matrix.name }}' \
            --upstream '${{ matrix.upstream }}' \
            --branch '${{ matrix.branch }}' \
            --destination-owner '${{ matrix.destination_owner }}' \
            --report "$REPORT"
      - name: Mint toolchain dispatch App token
        if: steps.sync.outcome == 'success'
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RUBY_ZIG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.RUBY_ZIG_DISPATCH_APP_PRIVATE_KEY }}
          owner: ruby-zig
          repositories: toolchain
          permission-actions: write
      - name: Dispatch exact synchronized SHA
        if: steps.sync.outcome == 'success'
        id: dispatch
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          SYNC_REPORT: ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.lane_id }}.json
          DISPATCH_REPORT: ${{ runner.temp }}/ruby-zig-sync/dispatch-${{ matrix.lane_id }}.json
        run: |
          chmod +x scripts/dispatch-build.sh
          scripts/dispatch-build.sh \
            --sync-report "$SYNC_REPORT" \
            --name '${{ matrix.name }}' \
            --upstream '${{ matrix.upstream }}' \
            --branch '${{ matrix.branch }}' \
            --destination-owner '${{ matrix.destination_owner }}' \
            --report "$DISPATCH_REPORT"
      - name: Publish lane summary
        if: always()
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.lane_id }}.json
          DISPATCH_REPORT: ${{ runner.temp }}/ruby-zig-sync/dispatch-${{ matrix.lane_id }}.json
        run: |
          if [[ -s "$REPORT" ]]; then
            jq -r '"### `" + .repository + "@" + .branch + "`\n\nStatus: **" + .status + "**\n\nBefore: `" + (.before // "") + "`\n\nUpstream: `" + (.upstream_sha // "") + "`"' "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s "$DISPATCH_REPORT" ]]; then
            jq -r '"\n\nDispatch: **" + .outcome + "**\n\nController: `" + .controller.repository + "/" + .controller.workflow + "@" + .controller.ref + "`\n\nRun: " + (if .workflow_run == null then "not created" else "[" + (.workflow_run.id | tostring) + "](" + .workflow_run.html_url + ")" end)' "$DISPATCH_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload handoff reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: handoff-${{ matrix.lane_id }}
          path: |
            ${{ runner.temp }}/ruby-zig-sync/result-${{ matrix.lane_id }}.json
            ${{ runner.temp }}/ruby-zig-sync/dispatch-${{ matrix.lane_id }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Propagate lane failure
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          test "$SYNC_OUTCOME" = success
          test "$DISPATCH_OUTCOME" = success
